[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openleaf-core"
version = "0.1.0"
description = "Shared types and interfaces for the OpenLeaf aviation sustainability suite"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.12"
authors = [{ name = "Ramon Dalmau" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/ramondalmau/openleaf"
Repository = "https://github.com/ramondalmau/openleaf.git"

[tool.hatch.build.targets.wheel]
packages = ["src/openleaf"]
