[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openleaf-core"
version = "0.1.0"
description = "Shared types and interfaces for the OpenLeaf aviation sustainability suite"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.12"
authors = [
    { name = "Ramon DALMAU", email = "ramon.dalmau-codina@eurocontrol.int" },
    { name = "Gabriel JARRY", email = "gabriel.jarry@eurocontrol.int" },
    { name = "Philippe VERY", email = "philippe.very@eurocontrol.int" },
]
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/openleaf"
Repository = "https://github.com/eurocontrol-asu/openleaf.git"

[tool.hatch.build.targets.wheel]
packages = ["src/openleaf"]
