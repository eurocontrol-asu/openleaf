[project]
name = "openleaf"
version = "0.1.0"
description = "Open-source aviation sustainability suite: modular, differentiable aircraft performance modeling, emissions, and trajectory optimization."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Ramon DALMAU", email = "ramon.dalmau-codina@eurocontrol.int" },
    { name = "Gabriel JARRY", email = "gabriel.jarry@eurocontrol.int" },
    { name = "Philippe VERY", email = "philippe.very@eurocontrol.int" },
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff==0.15.9",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocs-monorepo-plugin>=1.1",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]
exclude = ["*/_version.py", "examples", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "PERF",   # perflint
    "T20",    # flake8-print
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # do not perform function calls in argument defaults
    "B905",     # zip without explicit strict parameter
    "SIM108",   # use ternary operator instead of if-else
    "TC001",    # move application import into TYPE_CHECKING
    "TC002",    # move third-party import into TYPE_CHECKING
    "RUF022",   # __all__ not sorted (prefer categorical organization)
    "UP046",    # Generic[T] syntax works better with mypy for duck-typed generics
    "N803",     # uppercase args (dT, V) — physics/aero naming conventions
    "N806",     # uppercase vars (T_isa, V) — physics/aero naming conventions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"**/tests/*.py" = [
    "S101",     # assert allowed in tests
    "ARG",      # unused arguments (fixtures)
    "PLR2004",  # magic values in tests OK
    "T20",      # print allowed in tests
    "B011",     # assert False allowed in tests
    "E402",     # late imports allowed in tests
]
"**/tests/**/*.py" = [
    "S101",     # assert allowed in tests
    "ARG",      # unused arguments (fixtures)
    "PLR2004",  # magic values in tests OK
    "T20",      # print allowed in tests
    "B011",     # assert False allowed in tests
    "E402",     # late imports allowed in tests
]
"examples/**/*.py" = [
    "T20",      # print allowed in CLI examples
    "C408",     # dict() calls OK in examples (matplotlib style)
    "PTH123",   # open() OK in examples
]
"experiments/**/*.py" = [
    "T20",      # print allowed in CLI scripts
    "C408",     # dict() calls OK (matplotlib style)
    "PTH123",   # open() OK in scripts
    "RUF059",   # unused variables OK (fig, ax patterns)
]
"src/openleaf/performance/_version.py" = ["UP007"]

[tool.ruff.lint.isort]
known-first-party = ["openleaf"]
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = [
    "packages/openleaf-core/tests",
    "packages/openleaf-performance/tests",
]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source_pkgs = []
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.uv.sources.openleaf-core]
workspace = true

[tool.uv.sources.openleaf-performance]
workspace = true
