name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: MyPy (openleaf-core)
        run: uv run --package openleaf-core mypy --config-file packages/openleaf-core/pyproject.toml packages/openleaf-core/src/ packages/openleaf-core/tests/
      - name: MyPy (openleaf-performance)
        working-directory: packages/openleaf-performance
        run: uv run mypy src/ tests/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pip-audit
        continue-on-error: true

  test:
    name: Test ${{ matrix.package }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [openleaf-core, openleaf-performance]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout BADA data
        if: matrix.package == 'openleaf-performance' && github.actor != 'dependabot[bot]'
        uses: actions/checkout@v6
        with:
          repository: eurocontrol-asu/bada-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: bada_data

      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-groups

      - name: Run tests
        env:
          OPENLEAF_BADA3_PATH: ${{ github.workspace }}/bada_data/3.16
          OPENLEAF_BADA4_PATH: ${{ github.workspace }}/bada_data/4.2.1
        run: uv run --package ${{ matrix.package }} --directory packages/${{ matrix.package }} pytest --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          fail_ci_if_error: false
