name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: MyPy (openleaf-core)
        working-directory: packages/openleaf-core
        run: |
          uv run mypy -p openleaf.core
          uv run mypy tests/
      - name: MyPy (openleaf-performance)
        working-directory: packages/openleaf-performance
        run: uv run mypy src/ tests/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pip-audit

  test:
    name: Test ${{ matrix.package }} (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, mandrell]
    strategy:
      fail-fast: false
      matrix:
        package: [openleaf-core, openleaf-performance]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout BADA data
        if: matrix.package == 'openleaf-performance'
        uses: actions/checkout@v6
        with:
          repository: eurocontrol-asu/bada-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: bada_data

      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-groups --all-extras

      - name: Run tests
        env:
          OPENLEAF_BADA3_PATH: ${{ github.workspace }}/bada_data/3.16
          OPENLEAF_BADA4_PATH: ${{ github.workspace }}/bada_data/4.2.1
        run: |
          uv run --package ${{ matrix.package }} --directory packages/${{ matrix.package }} \
            pytest --cov --cov-report=json:coverage.json --no-cov-on-fail -q

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage.json

  badges:
    name: Coverage Badges
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Generate badge JSON
        id: badges
        run: |
          mkdir -p _publish/badges

          score_color() {
            local SCORE=$1
            if [ "$SCORE" -ge 95 ]; then echo "brightgreen"
            elif [ "$SCORE" -ge 80 ]; then echo "green"
            elif [ "$SCORE" -ge 60 ]; then echo "yellow"
            else echo "red"; fi
          }

          write_badge() {
            local DIR=$1 NAME=$2 LABEL=$3 VALUE=$4
            mkdir -p "$DIR"
            local SCORE_INT=$(python3 -c "print(int(float('${VALUE}')))")
            local COLOR=$(score_color "$SCORE_INT")
            jq -n --arg l "$LABEL" --arg v "$VALUE" --arg c "$COLOR" \
              '{schemaVersion:1, label:$l, message:"\($v)%", color:$c, style:"flat"}' \
              > "$DIR/$NAME.json"
          }

          TOTAL_COV=0
          COUNT=0

          for PKG in openleaf-core openleaf-performance; do
            COV_FILE="_artifacts/coverage-$PKG/coverage.json"
            if [ -f "$COV_FILE" ]; then
              COV=$(jq '.totals.percent_covered_display' "$COV_FILE" | tr -d '"')
            else
              COV=0
            fi

            echo ":: $PKG — Coverage ${COV}%"
            write_badge "_publish/badges/$PKG" "coverage" "coverage" "$COV"

            TOTAL_COV=$(python3 -c "print(round($TOTAL_COV + float('${COV}'), 1))")
            COUNT=$((COUNT + 1))
          done

          AVG_COV=$(python3 -c "print(round($TOTAL_COV / $COUNT))")
          write_badge "_publish/badges" "coverage" "coverage" "$AVG_COV"

          echo "coverage=$AVG_COV" >> "$GITHUB_OUTPUT"
          echo ":: Average coverage: ${AVG_COV}%"

      - name: Push badges to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_publish
          keep_files: true
          commit_message: "ci: coverage=${{ steps.badges.outputs.coverage }}%"
