name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [openleaf-core, openleaf-performance]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: |
          uv run --package ${{ matrix.package }} pytest packages/${{ matrix.package }}/tests/ -v
        env:
          OPENLEAF_BADA3_PATH: ${{ secrets.OPENLEAF_BADA3_PATH }}
          OPENLEAF_BADA4_PATH: ${{ secrets.OPENLEAF_BADA4_PATH }}
