name: Publish to PyPI

on:
  push:
    tags:
      - "core/v*"
      - "performance/v*"

jobs:
  detect-package:
    name: Detect Package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.detect.outputs.package }}
      package-dir: ${{ steps.detect.outputs.package-dir }}
    steps:
      - id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == core/* ]]; then
            echo "package=openleaf-core" >> "$GITHUB_OUTPUT"
            echo "package-dir=packages/openleaf-core" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == performance/* ]]; then
            echo "package=openleaf-performance" >> "$GITHUB_OUTPUT"
            echo "package-dir=packages/openleaf-performance" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown tag prefix: $TAG"
            exit 1
          fi

  test:
    name: Run Tests (${{ needs.detect-package.outputs.package }})
    needs: detect-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run --package ${{ needs.detect-package.outputs.package }} --directory ${{ needs.detect-package.outputs.package-dir }} pytest --no-cov

  publish:
    name: Build and Publish (${{ needs.detect-package.outputs.package }})
    runs-on: ubuntu-latest
    needs: [detect-package, test]
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.detect-package.outputs.package }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv python install 3.12
      - run: uv build --package ${{ needs.detect-package.outputs.package }}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1 (2026-06 head)
