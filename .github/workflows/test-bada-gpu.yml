name: Test BADA + GPU

on:
  workflow_dispatch:

concurrency:
  group: test-bada-gpu
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-bada-gpu:
    name: Test with BADA data + GPU
    runs-on: [self-hosted, mandrell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout BADA data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eurocontrol-asu/bada-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: bada_data

      - run: uv python install 3.12
      - run: uv sync --all-groups --all-extras

      - name: Run tests
        env:
          OPENLEAF_BADA3_PATH: ${{ github.workspace }}/bada_data/3.16
          OPENLEAF_BADA4_PATH: ${{ github.workspace }}/bada_data/4.2.1
        run: |
          uv run --package openleaf-performance --directory packages/openleaf-performance \
            pytest --no-cov -q

      - name: Clean BADA data from runner workspace
        if: always()
        run: rm -rf "${{ github.workspace }}/bada_data"
