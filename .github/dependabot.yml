version: 2
updates:
  # uv ecosystem covers pyproject.toml + uv.lock (the pip ecosystem does
  # not update uv lockfiles, so the previous config never bumped anything).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # These are library requirements: move uv.lock within the declared
    # ranges and widen a range only when a release falls outside it, rather
    # than raising every minimum version users must install.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
